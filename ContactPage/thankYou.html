<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <link rel="icon" type="image/png" href="imgs/apple-icon-114x114.png">
    <link rel="stylesheet" href="../responsive.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scrollbar-width: thin;
            scrollbar-color: var(--karmir) #393939;
        }

        @font-face {
            font-family: braind-yerevan;
            src: url(BraindYerevan.otf);
        }

        :root {
            --karmir: #EC1E24;
            --backgrounColor: #181818;
        }

        html {
            scroll-behavior: smooth;
        }

        .active {
            color: #EC1E24;
        }

        body {
            background-color: var(--backgrounColor);
            user-select: none;
            -webkit-user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            /* padding: 100px 0; */
            gap: 2rem;
            height: 100vh;
        }


        img {
            width: 300px;
        }

        .box-forthanks {
            width: 95%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* border: 1px solid red; */
            text-align: center;
            font-family: braind-yerevan;
            color: white;
            letter-spacing: 2px;
            font-size: 70px;
            font-weight: normal;
        }

        @media screen and (max-width:720px) {
            .box-forthanks{
                font-size: 50px;
            }
            img{
                width: 250px;
            }
        }
        @media screen and (max-width:420px) {
            .box-forthanks{
                font-size: 40px;
            }
            img{
                width: 200px;
            }
        }
        @media screen and (max-width:220px) {
            .box-forthanks{
                font-size: 20px;
            }
        }
    </style>
</head>

<body>


    <a href="../index.html">
        <img src="imgs/logo.svg" alt="">
    </a>
    <div class="box-forthanks">
        Շնորհակալություն <br> Ձեր Նամակը չի անտեսվի
    </div>

</body>

</html>
